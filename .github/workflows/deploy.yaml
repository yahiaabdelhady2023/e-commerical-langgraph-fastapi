name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Run Tests"] # This must exactly match the 'name:' defined in build.yaml
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Download the compiled dist/ artifact (if built in a separate job)
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # 3. Configure SSH access to your EC2 instance
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 4. Copy project files or dist/ to EC2
      - name: Copy files to EC2
        run: |
          rsync -avz --exclude '.git' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/

      # 5. Execute commands on EC2 (Install dependencies & restart app)
      - name: Deploy and restart application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd /home/${{ secrets.EC2_USER }}/dist
            uv venv
            source venv/bin/activate

            # Sync dependencies on EC2 using uv
            uv sync 

            tar -xzf e_commerical_langgraph_fastapi-0.1.0.tar.gz

            cd /home/${{ secrets.EC2_USER }}/app
            

            # moving service to systemctl
            sudo mv services/deploy.service /etc/systemd/system/

            # install nginx
            sudo apt install nginx -y

            # removing default nginx page
            sudo rm /etc/nginx/sites-enabled/default

            # create symbolic link
            ln -s  /nginx/nginx.conf /etc/nginx/sites-enabled/

            # restart systemctl
            sudo systemctl daemon-reload

            # run nginx
            sudo systemctl start nginx

            # run custom service
            sudo systemctl start deploy.service

            
            
            # Restart your application service (e.g., systemd service, supervisord, or pm2)
            sudo systemctl restart my-python-app
          EOF