server {
    # Port to listen on (80 is standard for HTTP)
    listen 80;
    #51.21.182.254
    # Your domain name or EC2 public IP address
    server_name 51.21.182.254; 

    location / {
        # Forward traffic to the port your Python app is running on (e.g., 8000)
        proxy_pass http://127.0.0.1:8000;

        # Pass important headers to your Python app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}